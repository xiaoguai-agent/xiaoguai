[package]
name = "xiaoguai-mcp-exec-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "L3 sandbox: wasmtime + pyodide (Python) and wasmtime + QuickJS-WASM (JavaScript) MCP servers. Capability-based isolation; per-tenant tier selector lives upstream (see DEC-019, DEC-020)."

[lib]
name = "xiaoguai_mcp_exec_wasm"
path = "src/lib.rs"

[[bin]]
name = "xiaoguai-mcp-exec-wasm-py"
path = "src/bin/python.rs"

[[bin]]
name = "xiaoguai-mcp-exec-wasm-js"
path = "src/bin/javascript.rs"

[dependencies]
xiaoguai-types = { path = "../xiaoguai-types" }
xiaoguai-mcp-exec = { path = "../xiaoguai-mcp-exec" }
xiaoguai-mcp-exec-js = { path = "../xiaoguai-mcp-exec-js" }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# wasmtime 47 — CVE-safe line. Clears everything the 45.x floor cleared
# (RUSTSEC-2026-0086/0087/0089 from 38.x, 0114 and the HIGH 0149 from
# 42.x, 0182's WASIp1 fd_renumber leak) and additionally
# RUSTSEC-2026-0222 (stores mixing type indices between engines), whose
# fix ranges are >=46.0.2 <47.0.0 OR >=47.0.3 — note 47.0.0..47.0.2 sit
# in a still-vulnerable gap, which is why dependabot's 47.0.2 PRs (#452,
# #450) were closed rather than merged.
#
# 46.x and 47.x both require rustc 1.94 (Edition 2024); rust-toolchain.toml
# moved to 1.94 in this same change, exactly as 45.x/1.93 moved together in
# ADR-0021 — see ADR-0023. Taking 47.0.4 rather than 46.0.3 buys the longer
# runway: ADR-0021 records that picking the more conservative line (42.0.2)
# was immediately invalidated by fresh advisories against it.
#
# 48.0.0 exists but requires rustc 1.95; deliberately not taken here.
#
# default-features off + explicit list keeps build time reasonable
# (avoids compiling features we never use: wat, profiling, etc.).
# `p1` is the preview1 WASI surface; `async` covers both the wasmtime
# async runtime and the component-model dep we need for wasi p1.
wasmtime = { version = "48.0.0", default-features = false, features = ["async", "cranelift", "runtime", "parallel-compilation"] }
wasmtime-wasi = { version = "47.0.4", default-features = false, features = ["p1"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
