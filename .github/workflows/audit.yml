name: Security audit (nightly)

# v1.1.8: nightly cargo-audit cron — fires at 08:00 UTC (16:00 Beijing).
# This catches advisories that landed since the last PR even when nobody
# touched the dep tree. On failure we open a GitHub issue so the on-call
# eng wakes up to a tracked work item rather than a buried Action log.
#
# 2026-08: ONE rolling issue, not one per run. The title used to embed
# ${{ github.run_id }}, so three weeks of unresolved advisories piled up
# 22 identical issues. Failures now update the single open `cargo-audit`
# issue, and a green run closes it.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.93.0

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: audit
        run: |
          set -o pipefail
          # --deny warnings escalates unmaintained / yanked / etc. to
          # error so the job fails cleanly instead of hiding behind a 0
          # exit code.
          cargo audit --deny warnings 2>&1 | tee audit-report.txt

      - name: Prepare issue body on failure
        if: failure()
        run: |
          {
            echo "# Nightly cargo-audit failure"
            echo ""
            echo "_This issue is the single rolling tracker — its body is"
            echo "overwritten by each failing nightly run, and it closes"
            echo "automatically once the audit goes green._"
            echo ""
            echo "Workflow: ${{ github.workflow }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '## Report'
            echo ''
            echo '```'
            cat audit-report.txt
            echo '```'
            echo ''
            echo "Action: review each advisory. Either upgrade the dep,"
            echo "ignore in \`deny.toml\` with a reason if dev-only, or"
            echo "open a downstream PR. Do not silently dismiss."
          } > issue-body.md

      # Reuse the existing tracker instead of opening a fresh issue per run.
      # Before this, the title carried ${{ github.run_id }}, so every nightly
      # cron minted a brand-new issue for the *same* unresolved advisories —
      # 22 duplicates accumulated over three weeks in Aug 2026. Now we look up
      # the one open `cargo-audit` issue and hand its number to
      # create-issue-from-file, which updates in place when given one.
      - name: Find existing audit issue
        if: failure()
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label cargo-audit \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            echo "Updating existing tracker #$number"
          else
            echo "No open tracker; a new issue will be opened"
          fi

      - name: Open or update issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Nightly cargo-audit failure"
          content-filepath: ./issue-body.md
          labels: security, automated, cargo-audit
          issue-number: ${{ steps.existing.outputs.number }}

      # Green run + an open tracker means the advisories were dealt with;
      # close it so the label stays a truthful signal of "audit is red".
      - name: Close tracker when audit passes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label cargo-audit \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" \
              --repo "${{ github.repository }}" \
              --comment "Nightly cargo-audit is green again (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Closing automatically."
          fi
